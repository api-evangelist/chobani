aid: chobani
name: Chobani
description: >-
  Chobani is an American food and beverage company founded in 2005 by Hamdi
  Ulukaya, best known for popularizing strained Greek yogurt in the United
  States and for operating what it describes as the world's largest yogurt
  facility in Twin Falls, Idaho. Its portfolio spans Greek yogurt, oat milk,
  plant-based yogurt, probiotic drinks, nutritional shakes, and — following the
  2023 acquisition of La Colombe Coffee Roasters — ready-to-drink coffee.
  Chobani sells through retail grocery, an away-from-home foodservice channel,
  Chobani Cafe locations, and a direct-to-consumer shop. Chobani is a privately
  held consumer packaged goods manufacturer and does not operate a public
  developer program: it publishes no developer portal, API documentation,
  machine-readable API contract, SDKs, or public webhook surface, and integrates
  with retail and distribution partners through EDI and private supply-chain
  connections rather than an open API.
